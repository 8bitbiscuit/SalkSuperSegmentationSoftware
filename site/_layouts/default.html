<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Session</a>
        <a href="{{ '/guide/' | relative_url }}"{% if page.url == '/guide/' %} aria-current="page"{% endif %}>Guide</a>
        <span id="who" class="who"></span>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/session.js' | relative_url }}" defer></script>
</body>
</html>
