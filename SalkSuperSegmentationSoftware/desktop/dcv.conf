# /etc/dcv/dcv.conf on the session AMI. The one DCV session is created by
# session-boot.sh; browsers reach it only through the session's tunnel.

[session-management]
create-session = false

[connectivity]
web-port = 8443
enable-quic-frontend = false
# Disconnect a browser after this many minutes without input. The watchdog
# ends the session IDLE_MINUTES after the last browser disconnects.
idle-timeout = 60

[security]
# The website's token, checked by dcv-token-verifier.py. The desktop user has
# no password, so there is no other way in.
auth-token-verifier = "http://127.0.0.1:8444"
